name: Quality Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked browser test runtime
        run: npm ci

      - name: Verify customer asset and workflow contracts
        run: npm run test:contracts

      - name: Verify executive dashboard hierarchy
        run: node --test tests/dashboard-control-summary.test.cjs

      - name: Install Chromium for the PC smoke test
        run: npx playwright install --with-deps chromium

      - name: Exercise the executive dashboard in a real browser
        run: node scripts/verify-dashboard-control-browser.cjs

      - name: Exercise Today and Customer Assets in a real browser
        run: npm run smoke:pc

      - name: Assemble the production release
        run: node scripts/build-production-ui.cjs

      - name: Verify release provenance and runtime hashes
        run: node scripts/verify-production-manifest.cjs ../deploy/netform-crm-production-pages
