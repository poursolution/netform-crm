name: Quality Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

# 2026-11-08 병합 시간 줄이기(대표 지시): 한 컴퓨터에서 8분 넘게 걸리던 PC 브라우저 검사를 컴퓨터 4대(smoke 1/4 ~ 4/4)에 나눠 동시에 돌리고,
# 나머지 계약 검사 · 배포본 조립은 checks 에서 함께 돈다. 필수 검사 이름 quality-gate 는 마지막에 모두 통과했는지만 모아 본다.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Decide whether CRM tests are needed
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-scope.sh

      - name: Use Node.js 24
        if: steps.scope.outputs.deck_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked browser test runtime
        if: steps.scope.outputs.deck_only != 'true'
        run: npm ci

      - name: Verify customer asset and workflow contracts
        if: steps.scope.outputs.deck_only != 'true'
        run: npm run test:contracts

      - name: Verify contract sales ledger transactions
        if: steps.scope.outputs.deck_only != 'true'
        run: npm run test:contract-db

      - name: Verify manual inquiry intake and retry contracts
        if: steps.scope.outputs.deck_only != 'true'
        run: node --test tests/inquiry-manual-create.test.cjs

      - name: Verify Aligo provider and campaign queue contracts
        if: steps.scope.outputs.deck_only != 'true'
        run: npm run test:aligo

      - name: Verify executive dashboard hierarchy
        if: steps.scope.outputs.deck_only != 'true'
        run: node --test tests/dashboard-control-summary.test.cjs

      - name: Install Chromium for the browser checks
        if: steps.scope.outputs.deck_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Exercise the executive dashboard in a real browser
        if: steps.scope.outputs.deck_only != 'true'
        run: node scripts/verify-dashboard-control-browser.cjs

      - name: Exercise manual inquiry intake in a real browser
        if: steps.scope.outputs.deck_only != 'true'
        run: node scripts/verify-inquiry-create-browser.cjs

      - name: Assemble the production release
        if: steps.scope.outputs.deck_only != 'true'
        run: node scripts/build-production-ui.cjs

      - name: Verify release provenance and runtime hashes
        if: steps.scope.outputs.deck_only != 'true'
        run: node scripts/verify-production-manifest.cjs ../deploy/netform-crm-production-pages

  smoke:
    name: smoke ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Decide whether CRM tests are needed
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-scope.sh

      - name: Use Node.js 24
        if: steps.scope.outputs.deck_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked browser test runtime
        if: steps.scope.outputs.deck_only != 'true'
        run: npm ci

      - name: Install Chromium for the PC smoke test
        if: steps.scope.outputs.deck_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Exercise Today and Customer Assets in a real browser
        if: steps.scope.outputs.deck_only != 'true'
        env:
          SMOKE_SHARD: ${{ matrix.shard }}/4
        run: npm run smoke:pc

  quality-gate:
    name: quality-gate
    needs: [checks, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every check to pass
        shell: bash
        env:
          CHECKS: ${{ needs.checks.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          echo "checks=$CHECKS smoke=$SMOKE"
          if [ "$CHECKS" != "success" ] || [ "$SMOKE" != "success" ]; then
            echo "검사가 모두 통과하지 않았습니다."
            exit 1
          fi
