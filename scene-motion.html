<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보고 발표 장면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* 보고 발표 — 실제 화면(2026.10.18)을 단순하게 다시 그린 단계별 장면. 1600×900 기준.
   ?s=장면 · &step=n(그 단계만 재생) · &embed=1(발표 파일 안)
   물체 속성: data-in="단계.신호"(보이기 시작) data-out(사라짐) data-hl / data-hr / data-dm="시작-끝"(강조 · 빨강 강조 · 흐리게) data-st="단계.신호:이름"(상태 s-이름) */
:root{--a:#3182F6;--a2:#1B64DA;--as:#EAF3FF;--o:#FF6F0F;--o2:#D65A00;--os:#FFF3EA;--red:#E5484D;--rs:#FDECEC;--grn:#16A34A;--gs:#E8F7EE;--ink:#191F28;--sub:#6B7684;--mut:#8B95A1;--line:#E5E8EB;--g:#F2F4F6;--e:cubic-bezier(.2,.7,.2,1)}
.site{--a:#FF6F0F;--a2:#D65A00;--as:#FFF3EA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#EEF0F3;font-family:Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
.wrap{position:relative;margin:14px auto 0;box-shadow:0 18px 50px rgba(25,31,40,.12);border-radius:10px;overflow:hidden;background:#fff}
html.emb,html.emb body{background:#fff}html.emb .wrap{margin:0 auto;box-shadow:none;border-radius:0}html.emb .ctl{display:none}
#sl{position:absolute;left:0;top:0;width:1600px;height:900px;background:#fff;transform-origin:0 0;overflow:hidden;letter-spacing:-.02em}
#sl .eb{position:absolute;left:80px;top:50px;font-size:21px;font-weight:800;color:var(--a)}
#sl h2{position:absolute;left:80px;top:86px;margin:0;font-size:46px;line-height:1.32;font-weight:800;letter-spacing:-.045em}
#sl h2 em{font-style:normal;color:var(--a)}
#sl .rail{position:absolute;right:80px;top:96px;display:grid}#sl .rail[hidden]{display:none}
#sl .rail:before{content:'';position:absolute;left:calc(50% / var(--n));right:calc(50% / var(--n));top:21px;height:2px;background:var(--line)}
#sl .rail button{position:relative;border:0;background:none;font:inherit;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;min-width:118px}
#sl .rail .n{width:44px;height:44px;border-radius:50%;background:var(--g);border:5px solid #fff;box-sizing:content-box;margin-top:-5px;display:grid;place-items:center;font-size:18px;font-weight:800;transition:background .35s,color .35s}
#sl .rail .nm{font-size:18px;font-weight:800;color:var(--ink);opacity:.45;transition:opacity .35s,color .35s;white-space:nowrap}
#sl .rail .pb{width:64%;height:4px;border-radius:2px;background:var(--g);overflow:hidden;margin-top:2px}
#sl .rail .pb i{display:block;height:100%;width:0;background:var(--a)}
#sl .rail button.on .n{background:var(--a);color:#fff}
#sl .rail button.on .nm{opacity:1;color:var(--a)}
#sl .rail button.past .n{background:var(--as);color:var(--a2)}
#sl .rail button.past .nm{opacity:.8}
#sl .sh{position:absolute;left:80px;top:234px;display:flex;align-items:center;gap:14px}
#sl .sh .role{font-size:17px;font-weight:800;color:var(--a2);background:var(--as);padding:5px 12px;border-radius:8px;white-space:nowrap}
#sl .sh h3{margin:0;font-size:29px;font-weight:800;letter-spacing:-.04em}
#sl .msg{position:absolute;left:80px;right:80px;top:772px;margin:0;text-align:center;font-size:25px;font-weight:700;letter-spacing:-.035em;line-height:1.4}
#sl .msg strong{color:var(--a)}
#sl .foot{position:absolute;left:80px;right:80px;top:836px;margin:0;text-align:center;font-size:15px;font-weight:600;color:var(--mut)}
#sl .fade{animation:fadeup .5s var(--e) both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#st{position:absolute;left:80px;top:290px;width:1440px;height:460px}
.ctl{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px auto 0;font-size:15px;color:#4E5968}
.ctl button{font:inherit;font-weight:700;border:1px solid #D1D6DB;background:#fff;color:var(--ink);border-radius:10px;padding:9px 16px;cursor:pointer}
.ctl button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctl .pos{min-width:90px;text-align:center;font-weight:700}

/* ── 공통 부품 ── */
#st .yw{position:absolute;left:0;top:0;width:1440px;height:460px;background:#fff;border:1.5px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(25,31,40,.06);padding:30px 44px;display:grid;grid-template-columns:1fr 64px 1fr;align-items:center}
#st .yw .c{display:flex;flex-direction:column;justify-content:center}
#st .yw .k{font-size:17px;font-weight:800;color:var(--sub)}
#st .yw .c.n .k{color:var(--a)}
#st .yw h4{margin:8px 0 18px;font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.38}
#st .yw .qs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#st .yw .q{padding:10px 16px;border-radius:14px;background:var(--g);font-size:20px;font-weight:800;color:var(--ink)}
#st .yw .c.n .q{background:var(--as);color:var(--a2)}
#st .yw .qa{color:var(--mut);font-size:18px;font-weight:800}
#st .yw .ar{font-size:38px;font-weight:800;color:var(--mut);text-align:center}
#st .yw .ps{margin-top:16px;font-size:17px;font-weight:700;color:var(--sub);line-height:1.5}
#st .yw .ps b{color:var(--ink)}
#st .qc{position:absolute;padding:4px 10px;border-radius:8px;background:var(--a);color:#fff;font-size:14px;font-weight:800;white-space:nowrap;z-index:4;box-shadow:0 4px 12px rgba(25,31,40,.12)}

#st .ab{position:absolute}
#st .pane{position:absolute;background:#fff;border:1.5px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(25,31,40,.06);padding:16px 20px}
#st .lbl{font-size:15px;font-weight:800;color:var(--sub)}
#st .num{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
#st .num small{font-size:17px;font-weight:700;margin-left:2px}
#st .sub{font-size:15px;font-weight:600;color:var(--sub);line-height:1.45}
#st .tag{display:inline-block;font-size:14px;font-weight:800;padding:2px 9px;border-radius:7px;white-space:nowrap;vertical-align:1px}
#st .tag.r{color:var(--red);background:var(--rs)}#st .tag.b{color:#1B64DA;background:#EAF3FF}#st .tag.o{color:var(--o2);background:var(--os)}#st .tag.g{color:var(--grn);background:var(--gs)}#st .tag.k{color:var(--sub);background:var(--g)}#st .tag.d{color:var(--ink);background:#fff;border:1.5px dashed var(--mut)}
#st .red{color:var(--red)}#st .blue{color:#1B64DA}#st .org{color:var(--o2)}#st .grn{color:var(--grn)}#st .mut{color:var(--mut)}
#st .btn{display:inline-grid;place-items:center;height:38px;padding:0 16px;border-radius:10px;font-size:16px;font-weight:800;background:var(--g);color:var(--ink);white-space:nowrap}
#st .btn.p{background:var(--a);color:#fff}#st .btn.s{background:var(--as);color:var(--a2)}#st .btn.k{background:var(--ink);color:#fff}
#st .row{display:flex;align-items:center;gap:10px}
#st .kv{display:grid;grid-template-columns:1fr auto;align-items:center;height:40px;font-size:17px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--line)}
#st .kv b{color:var(--ink);font-weight:800;text-align:right}
#st .note{font-size:15px;font-weight:700;color:var(--a2);background:var(--as);border-radius:10px;padding:8px 12px;line-height:1.45}
#st .note.r{color:var(--red);background:var(--rs)}#st .note.k{color:var(--sub);background:var(--g)}
#st .bar{display:block;height:8px;border-radius:4px;background:var(--g);overflow:hidden}
#st .bar i{display:block;height:100%;border-radius:4px;background:var(--a);transition:width 1.4s var(--e)}
#st .chk{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
#st .chk>i{width:24px;height:24px;border-radius:7px;border:2px solid #D1D6DB;margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:900;color:transparent;transition:background .3s,border-color .3s,color .3s}
#st .chk b{font-size:18px;font-weight:800}
#st .chk p{margin:2px 0 0;font-size:15px;font-weight:600;color:var(--sub);line-height:1.45}
#st .chk.s-ok>i{background:var(--grn);border-color:var(--grn);color:#fff}
#st .cell{display:grid;place-items:center;height:36px;border-radius:8px;font-size:17px;font-weight:800;color:var(--mut);background:#FAFBFC}
#st .it{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:700;line-height:1.4}
#st .it i{width:26px;height:26px;border-radius:8px;background:var(--g);font-style:normal;font-size:14px;font-weight:900;display:grid;place-items:center}
/* 상태 움직임 */
#st [data-in],#st [data-out],#st [data-hl],#st [data-hr],#st [data-dm],#st [data-st]{transition:opacity .5s ease var(--d,0s),transform .7s var(--e) var(--d,0s),left .9s var(--e),top .9s var(--e),box-shadow .4s,border-color .4s,background-color .4s,color .4s}
#st [data-in]:not(.in){opacity:0;transform:translateY(10px)}
#st [data-in].fl:not(.in){transform:translateX(-28px)}#st [data-in].fr:not(.in){transform:translateX(28px)}#st [data-in].zm:not(.in){transform:scale(.94)}
#st .out{opacity:0!important;pointer-events:none}
#st .hl{border-color:var(--a)!important;box-shadow:0 0 0 3px var(--a),0 0 0 9px var(--as)!important;position:relative;z-index:3}
#st .hr{border-color:var(--red)!important;box-shadow:0 0 0 3px var(--red),0 0 0 9px var(--rs)!important;position:relative;z-index:3}
#st .pane.hl,#st .pane.hr,#st .ab.hl,#st .ab.hr{position:absolute}
#st .mk{padding:0 3px;margin:0 -3px;border-radius:6px}
#st .mk.hl{box-shadow:none!important;background:var(--as);color:var(--a2)}
#st .mk.hr{box-shadow:none!important;background:var(--rs);color:var(--red)}
#st .dm{opacity:.3}
#st.instant *,#st.instant *:before,#st.instant *:after{transition:none!important;animation:none!important}
#st.paused *{animation-play-state:paused!important}

/* ── b06 문의 한 건 ── */
.S-b06 .pg{left:24px;right:24px;top:92px;height:52px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.S-b06 .pg>div{border-radius:10px;background:var(--g);padding:6px 14px;font-size:17px;font-weight:800;color:var(--mut)}
.S-b06 .pg small{display:block;font-size:13px;font-weight:600;margin-top:1px}
.S-b06 .pg .s-on{background:var(--a);color:#fff}
.S-b06 .col{top:160px;bottom:14px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.S-b06 .qt{margin:8px 0 12px;padding:10px 14px;border-radius:12px;background:var(--g);font-size:20px;font-weight:700}
.S-b06 .rw{display:grid;grid-template-columns:70px 1fr;align-items:center;height:36px;font-size:18px;font-weight:600}
.S-b06 .rw span{color:var(--sub)}
.S-b06 .miss{color:var(--o2);font-weight:800;text-decoration:underline dashed 1.5px;text-underline-offset:4px}
.S-b06 .tl{position:absolute;left:18px;right:18px;top:118px;height:120px}
.S-b06 .tl .lnn{position:absolute;left:0;right:0;top:34px;height:3px;background:var(--line)}
.S-b06 .tl .lnn i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--red);transition:width 2.6s linear}
.S-b06 .tl.s-full .lnn i{width:100%}
.S-b06 .tl .dy{position:absolute;top:20px;transform:translateX(-50%);text-align:center;font-size:14px;font-weight:700;color:var(--mut)}
.S-b06 .tl .dy:before{content:'';display:block;width:12px;height:12px;margin:8px auto 6px;border-radius:50%;background:#fff;border:3px solid #D1D6DB;transition:border-color .2s calc(var(--k)*.45s),background .2s calc(var(--k)*.45s)}
.S-b06 .tl.s-full .dy:before{border-color:var(--red);background:var(--rs)}
.S-b06 .op{margin-top:8px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:17px;font-weight:800}
.S-b06 .op small{display:block;font-size:13px;font-weight:600;color:var(--sub)}
.S-b06 .bx{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.S-b06 .bx div{border:1.5px solid var(--line);border-radius:14px;padding:8px 16px;font-size:15px;font-weight:700;color:var(--sub)}
.S-b06 .bx b{display:block;font-size:30px;color:var(--ink);font-weight:800}
.S-b06 .ro{display:grid;grid-template-columns:60px 1fr 100px 110px 110px;align-items:center;height:58px;padding:0 10px;border-radius:12px;font-size:16px;font-weight:600;color:var(--sub);border:1.5px solid transparent}
.S-b06 .ro .d{width:46px;height:46px;border-radius:50%;background:var(--rs);color:var(--red);font-weight:800;display:grid;place-items:center}
.S-b06 .ro b{display:block;font-size:19px;color:var(--ink)}

/* ── b08 대시보드 ── */
.S-b08 .sc{top:0;width:228px;height:150px;padding:14px 16px}
.S-b08 .sc .num{margin-top:8px;font-size:34px}
.S-b08 .sc .sub{margin-top:4px;font-size:13.5px;line-height:1.4}
.S-b08 .rr{display:grid;grid-template-columns:1fr auto;align-items:center;height:50px;border-bottom:1px solid var(--line);font-size:18px;font-weight:700;padding:0 8px;border-radius:8px;border:1.5px solid transparent;border-bottom-color:var(--line)}
.S-b08 .bk{display:grid;grid-template-columns:160px 1fr 70px;align-items:center;gap:12px;height:40px;font-size:17px;font-weight:700}
.S-b08 .bk .bar{height:14px;border-radius:7px}
#st .bk .bar i{width:0}#st .bk.s-go .bar i{width:var(--w)}

/* ── b07 영업건 한 건 ── */
.S-b07 .stg{left:24px;right:24px;top:84px;height:30px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.S-b07 .stg div{border-top:4px solid #191F28;padding-top:4px;font-size:14px;font-weight:700;color:var(--sub)}
.S-b07 .stg .f{border-top-color:var(--line);color:var(--mut)}
.S-b07 .stg .cur{border-top-color:var(--a);color:var(--a2);font-weight:900}
.S-b07 .col{top:130px;bottom:14px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.S-b07 .ev{display:grid;grid-template-columns:170px 1fr;align-items:center;min-height:42px;padding:4px 12px;margin-top:6px;border-radius:10px;background:#F8F9FA;font-size:16px;font-weight:700}
.S-b07 .ev small{font-size:13px;font-weight:600;color:var(--mut)}
.S-b07 .ev.x{background:#fff;border:1.5px dashed #D1D6DB}
.S-b07 .iv{display:grid;grid-template-columns:96px 1fr;align-items:center;height:36px;font-size:17px;font-weight:600;color:var(--sub)}
.S-b07 .iv b{color:var(--ink);justify-self:start}

/* ── b22 컨트롤타워 ── */
.S-b22 .tb{display:grid;grid-template-columns:92px repeat(6,1fr);gap:6px;align-items:center}
.S-b22 .tb .h{font-size:13px;font-weight:800;color:var(--sub);text-align:center;line-height:1.25}
.S-b22 .tb .nm{font-size:16px;font-weight:800}
.S-b22 .tb .c1{background:#F4C2C2;color:#9B1C1C}.S-b22 .tb .c2{background:#FBE3B8;color:#8A5300}.S-b22 .tb .c3x{background:#DDE1E6;color:#333D4B}.S-b22 .tb .c4{background:#FDE2E2;color:#B42318}
.S-b22 .cd{top:0;width:338px;height:300px;padding:14px 16px}
.S-b22 .cd .why{font-size:15px;font-weight:800;color:var(--red)}
.S-b22 .cd .tt{font-size:20px;font-weight:800;margin-top:2px}
.S-b22 .flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.S-b22 .flow div{text-align:center;font-size:14px;font-weight:800;color:var(--mut);padding-top:8px;border-top:4px solid var(--line)}
.S-b22 .flow .ok{border-top-color:var(--ink);color:var(--ink)}
.S-b22 .flow .st{border-top-color:var(--red);color:var(--red)}
.S-b22 .rr{display:grid;grid-template-columns:1fr 54px;align-items:center;height:56px;border-bottom:1px solid var(--line)}

/* ── b21 성과분석 ── */
.S-b21 .split{height:44px;border-radius:10px;background:var(--g);overflow:hidden;display:flex}
.S-b21 .split div{height:100%;display:flex;align-items:center;padding:0 14px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;width:0;overflow:hidden;transition:width 1.4s var(--e)}
.S-b21 .split .a{background:#3B6FE0}.S-b21 .split .b{background:#E58F8F}
.S-b21 .split.s-go .a{width:63.6%}.S-b21 .split.s-go .b{width:13.9%;transition-delay:.9s}
.S-b21 .wy{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;line-height:1.45}
.S-b21 .wy i{width:22px;height:22px;border-radius:50%;background:var(--rs);color:var(--red);font-style:normal;font-size:13px;font-weight:900;display:grid;place-items:center;margin-top:2px}
.S-b21 .pr{display:grid;grid-template-columns:230px 1fr 60px;gap:12px;align-items:center;height:44px;font-size:17px;font-weight:700}

/* ── b23 고객자산 ── */
.S-b23 .tabs{display:flex;gap:22px;font-size:18px;font-weight:700;color:var(--sub);border-bottom:1.5px solid var(--line);padding-bottom:8px}
.S-b23 .tabs b{color:var(--ink);margin-left:4px}
.S-b23 .ar{display:grid;grid-template-columns:1fr 110px 250px 80px;align-items:center;height:62px;padding:0 10px;border-radius:10px;border:1.5px solid transparent;border-bottom-color:var(--line)}
.S-b23 .ar b{display:block;font-size:18px;font-weight:800}
.S-b23 .ar small{font-size:14px;font-weight:600;color:var(--sub)}
.S-b23 .chain{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;flex-wrap:wrap}
.S-b23 .chain span{padding:5px 10px;border-radius:8px;background:var(--g)}
.S-b23 .chain em{font-style:normal;color:var(--mut)}
.S-b23 .bub{display:inline-block;width:120px;height:22px;border-radius:11px;background:#F3EFE3;vertical-align:middle;margin-left:8px}
.S-b23 .tlr{display:grid;grid-template-columns:110px 1fr;align-items:center;height:40px;font-size:15px;font-weight:700;color:var(--sub);border-bottom:1px dashed var(--line)}

/* ── b24 확장관리 ── */
.S-b24 .fs{display:flex;align-items:center;gap:10px}
.S-b24 .fs .st{padding:8px 16px;border-radius:12px;background:var(--g);font-size:18px;font-weight:800;white-space:nowrap}
.S-b24 .fs .st small{display:block;font-size:13px;font-weight:600;color:var(--sub)}
.S-b24 .fs .ar{font-size:22px;color:var(--mut);font-weight:800}
.S-b24 .q4{top:146px;width:350px;height:124px}
.S-b24 .er{display:grid;grid-template-columns:1fr 450px 110px 80px;align-items:center;height:50px;padding:0 10px;border-radius:10px;border:1.5px solid transparent;border-bottom-color:var(--line)}
.S-b24 .er b{display:block;font-size:17px;font-weight:800}
.S-b24 .er small{font-size:13px;font-weight:600;color:var(--sub)}

/* ── s01 연결 구간 ── */
.S-s01 .lane{position:absolute;left:0;width:1040px;height:190px;border-radius:20px;border:1.5px solid var(--line);background:#fff}

const Q=new URLSearchParams(location.search),EMB=Q.get('embed')==='1',ID=SC[Q.get('s')]?Q.get('s'):'b06',S=SC[ID],ONLY=Q.has('step')?+Q.get('step'):null;
if(EMB)document.documentElement.classList.add('emb');
const sl=document.getElementById('sl'),wrap=document.getElementById('wrap');if(S.site)sl.classList.add('site');
const N=S.steps.length;document.title=S.eb.replace(/^.*— /,'');
sl.innerHTML='<div class="eb">'+S.eb+'</div><h2>'+S.h2+'</h2><nav class="rail"'+(N<2?' hidden':'')+' style="--n:'+N+';grid-template-columns:repeat('+N+',1fr)">'+S.steps.map((x,i)=>'<button data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="nm">'+x.nm+'</span><span class="pb"><i></i></span></button>').join('')+'</nav><div class="sh"><span class="role" id="role"></span><h3 id="ttl"></h3></div><div id="st" class="S-'+ID+'"></div><p class="msg" id="msg"></p><p class="foot">'+(S.foot||'')+'</p>';
const st=document.getElementById('st');st.innerHTML=S.html;
const btns=[...sl.querySelectorAll('.rail button')],pbs=btns.map(b=>b.querySelector('.pb i')),play=document.getElementById('play'),pos=document.getElementById('pos');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pv=s=>{const [a,b]=String(s).split('.');return (+a)*100+(+(b||0))};
const rng=(spec,P)=>spec.split(/\s+/).filter(Boolean).some(r=>{const [a,b]=r.split('-');return P>=pv(a)&&(!b||P<pv(b))});
const EL=[...st.querySelectorAll('[data-in],[data-out],[data-hl],[data-hr],[data-dm],[data-st]')];
function apply(P){EL.forEach(el=>{const d=el.dataset;
  if(d.in!=null)el.classList.toggle('in',P>=pv(d.in));
  if(d.out!=null)el.classList.toggle('out',P>=pv(d.out));
  if(d.hl!=null)el.classList.toggle('hl',rng(d.hl,P));
  if(d.hr!=null)el.classList.toggle('hr',rng(d.hr,P));
  if(d.dm!=null)el.classList.toggle('dm',rng(d.dm,P));
  if(d.st!=null){let cur=null;const L=d.st.split(/\s+/).map(x=>x.split(':'));L.forEach(([t,c])=>{if(P>=pv(t))cur=c});L.forEach(([,c])=>{if(c!==cur)el.classList.remove('s-'+c)});if(cur)el.classList.add('s-'+cur)}})}
let cur=0,t=0,run=false,all=false,last=0,raf=0,applied=0,done=false;
const fadeIn=el=>{el.classList.remove('fade');void el.offsetWidth;el.classList.add('fade')};
function ui(i){btns.forEach((b,k)=>{b.classList.toggle('on',k===i);b.classList.toggle('past',k<i);pbs[k].style.width=k<i?'100%':'0'});
 document.getElementById('role').textContent=S.steps[i].role;document.getElementById('ttl').textContent=S.steps[i].title;document.getElementById('msg').innerHTML=S.steps[i].msg;
 fadeIn(sl.querySelector('.sh'));fadeIn(document.getElementById('msg'));pos.textContent=(i+1)+' / '+N}
function btn(){play.textContent=run?'❚❚ 일시정지':(t>0&&!done?'▶ 이어서 재생':'▶ 전체 재생')}
function snap(P){st.classList.add('instant');apply(P);void st.offsetWidth;st.classList.remove('instant')}
function jump(i,go){cancelAnimationFrame(raf);run=false;done=false;st.classList.remove('paused');
 snap(i*100+99);cur=i;t=0;applied=0;ui(i);
 if(reduced){st.classList.add('instant');apply((i+1)*100+99);done=true;btn();return}
 apply((i+1)*100);if(go){run=true;last=performance.now();raf=requestAnimationFrame(tick)}btn()}
function tick(now){if(!run)return;t+=now-last;last=now;const s=S.steps[cur];
 let ch=false;while(applied<s.c.length&&s.c[applied]<=t){applied++;ch=true}if(ch)apply((cur+1)*100+applied);
 pbs[cur].style.width=Math.min(100,t/s.d*100)+'%';
 if(t>=s.d){if(all&&cur<N-1){cur++;t=0;applied=0;ui(cur);apply((cur+1)*100)}else{run=false;done=true;pbs[cur].style.width='100%';btn();return}}
 raf=requestAnimationFrame(tick)}
function pause(){if(!run)return;run=false;cancelAnimationFrame(raf);st.classList.add('paused');btn()}
function resume(){run=true;last=performance.now();st.classList.remove('paused');raf=requestAnimationFrame(tick);btn()}
function toggle(){if(run)pause();else if(t>0&&!done)resume();else{all=true;jump(0,true)}}
btns.forEach((b,i)=>b.addEventListener('click',()=>{all=false;jump(i,true)}));
play.addEventListener('click',toggle);document.getElementById('replay').addEventListener('click',()=>{all=false;jump(cur,true)});
addEventListener('keydown',e=>{if(EMB&&!(e.key==='r'||e.key==='R')){try{parent.dispatchEvent(new KeyboardEvent('keydown',{key:e.key,code:e.code,bubbles:true,cancelable:true}))}catch(_){}e.preventDefault();return}
 if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowRight'&&cur<N-1){all=false;jump(cur+1,true)}else if(e.key==='ArrowLeft'&&cur>0){all=false;jump(cur-1,true)}else if(e.key==='r'||e.key==='R'){all=false;jump(cur,true)}});
const fit=()=>{const k=EMB?Math.min(innerWidth/1600,innerHeight/900):Math.min((innerWidth-28)/1600,(innerHeight-86)/900);sl.style.transform='scale('+k+')';wrap.style.width=1600*k+'px';wrap.style.height=900*k+'px';if(EMB)wrap.style.marginTop=Math.max(0,(innerHeight-900*k)/2)+'px'};
addEventListener('resize',fit);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
fit();
const i0=ONLY!=null?Math.max(0,Math.min(N-1,ONLY)):0;
snap(i0*100+99);ui(i0);cur=i0;
setTimeout(()=>{if(!run&&t===0){all=ONLY==null;jump(i0,true)}},EMB?60:600);
window.SceneMotion={N,jump:i=>{all=false;jump(i,true)},pause,end:i=>{cancelAnimationFrame(raf);run=false;snap((i+1)*100+99);ui(i);cur=i}};
})();
